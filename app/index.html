<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>Doodle Jump - Telegram Mini App</title>
        <meta name="description" content="">
        <!-- Измените viewport для мобильных устройств -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
        
        <!-- ДОБАВЬТЕ ЭТУ СТРОКУ -->
        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        
        <link rel="stylesheet" href="styles/main.css">
        <script src="components/modernizr/modernizr.js"></script>
    </head>
    <body>
    <div class="container">
        <div class="game">
        </div>
    </div>
    
    <!-- build:js scripts/app.js -->
    <script src="components/zepto/zepto.js"></script>
    <script src="components/asEvented/asevented.js"></script>
    <script src="components/howler.js/howler.js"></script>
    
    <!-- ДОБАВЬТЕ ЭТОТ СКРИПТ ДО require.js -->
    <script>
        // Telegram Mini App initialization
        window.addEventListener('load', function() {
            if (typeof Telegram !== 'undefined') {
                const tg = window.Telegram.WebApp;
                tg.expand(); // Full screen mode
                tg.BackButton.hide();
                
                // Optional: Set theme colors
                tg.setHeaderColor('#2ea6ff');
                tg.setBackgroundColor('#222222');
                
                console.log('Telegram Web App initialized successfully');
            }
        });
    </script>
    
    <script data-main="scripts/main" src="scripts/vendor/require.js"></script>
    <!-- endbuild -->
</body>
</html>
